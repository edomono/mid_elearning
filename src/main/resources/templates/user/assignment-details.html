<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title th:text="${assignment.title}">Assignment Details</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Animations */
    @keyframes slideDown {
      from { transform: translateY(-20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .animate-slide-down {
      animation: slideDown 0.5s ease-out;
    }
    .animate-slide-up {
      animation: slideUp 0.5s ease-out;
    }
    .animate-fade-in {
      animation: fadeIn 0.3s ease-out;
    }
    .success-alert {
      animation: slideDown 0.3s ease-out;
    }
    .submission-box {
      transition: all 0.3s ease-out;
    }
    .submission-box:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .form-input {
      transition: all 0.2s ease;
    }
    .form-input:focus {
      transform: translateY(-1px);
      box-shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.1);
    }
    .btn-animated {
      transition: all 0.2s ease;
    }
    .btn-animated:hover {
      transform: scale(1.05);
    }
    .btn-animated:active {
      transform: scale(0.95);
    }
  </style>
</head>

<body class="bg-[#0074cc] min-h-screen flex flex-col">

<!-- Header -->
<div th:replace="user/dashboard :: header"></div>

<main class="flex justify-center items-start py-10 px-6 flex-1">

  <div class="bg-white w-3/4 p-8 rounded-2xl shadow-lg border">

    <!-- Title -->
    <h1 class="text-2xl font-bold text-blue-700 animate-slide-down" th:text="${assignment.title}"></h1>

    <!-- Description -->
    <p class="mt-2 text-gray-700 text-sm animate-fade-in" 
       style="animation-delay: 0.1s"
       th:text="${assignment.description}"></p>

    <!-- Deadline -->
    <p class="mt-3 text-xs text-gray-600 animate-fade-in"
       style="animation-delay: 0.2s">
      Deadline:
      <span class="text-red-600 font-semibold"
            th:text="${#temporals.format(assignment.deadline, 'dd MMM yyyy HH:mm')}">
      </span>
    </p>

    <!-- Status upload -->
    <div class="mt-6 p-4 rounded-lg border bg-gray-50 submission-box animate-slide-up"
         style="animation-delay: 0.3s">
      <p class="font-semibold text-blue-700">Your Submission:</p>

      <!-- Jika sudah submit -->
      <div th:if="${submission != null}">
        <a th:href="@{'/' + ${submission.filePath}}"
           class="text-green-600 font-medium hover:underline text-sm"
           th:text="${submission.fileName}"></a>

        <p class="text-xs text-gray-500 mt-1">
          Uploaded at
          <span th:text="${#temporals.format(submission.uploadTime, 'dd/MM/yyyy HH:mm')}"></span>
        </p>

        <p class="text-xs text-gray-500">
          Status:
          <span class="text-green-600 font-semibold">Submitted ✅</span>
        </p>
      </div>

      <!-- Jika belum submit -->
      <p th:if="${submission == null}" class="text-sm text-gray-500">
        You haven't submitted anything yet ❌
      </p>
    </div>

    <hr class="my-6">

    <!-- Form Upload -->
    <form th:action="@{'/user/assignment/' + ${assignment.id} + '/submit'}"
          method="post" enctype="multipart/form-data" class="space-y-4">

      <input type="file" name="file" required
             class="w-full bg-gray-100 border rounded px-4 py-2 text-sm form-input transition-all duration-200 hover:border-blue-300 focus:ring-2 focus:ring-blue-400 focus:border-blue-400">

  <!-- Optional note / message -->
  <textarea name="note" placeholder="Optional note or message to mentor" rows="3"
        class="w-full bg-gray-100 border rounded px-4 py-2 text-sm form-input transition-all duration-200 hover:border-blue-300 focus:ring-2 focus:ring-blue-400 focus:border-blue-400"></textarea>

      <button
        class="text-white px-6 py-2 rounded-lg transition font-semibold btn-animated"
        th:classappend="${submission != null} ? 'bg-yellow-500 hover:bg-yellow-600' : 'bg-green-500 hover:bg-green-600'"
        th:text="${submission != null} ? 'Re-upload File' : 'Submit Assignment'">
      </button>
    </form>

    <!-- Grade & Feedback -->
    <div th:if="${submission != null}" class="mt-6 p-5 bg-blue-50 border rounded-lg animate-fade-in"
         style="animation-delay: 0.4s">
      <p class="font-semibold text-blue-700 text-sm">
        Grade:
        <span th:text="${submission.grade != null ? submission.grade : '-'}"
              class="font-bold text-lg"></span>
      </p>

      <p class="text-xs mt-1 text-gray-600 font-medium">Feedback:</p>
      <p class="text-sm text-gray-800"
         th:text="${submission.comment != null ? submission.comment : 'No feedback yet'}"></p>
    </div>

    <!-- Alert success / error -->
    <div th:if="${param.success}" class="mt-4 text-sm text-green-600 font-semibold success-alert p-3 bg-green-50 rounded-lg">
      ✅ File uploaded successfully!
    </div>
    <div th:if="${param.error}" class="mt-4 text-sm text-red-600 font-semibold success-alert p-3 bg-red-50 rounded-lg">
      ❌ Failed to upload file
    </div>

  </div>
</main>

<!-- Footer -->
<div th:replace="user/dashboard :: footer"></div>

</body>
</html>
