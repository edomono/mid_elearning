<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Profile Details</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0074cc] min-h-screen flex flex-col">
  <!-- HEADER -->
  <div th:replace="user/dashboard :: header"></div>
  <main class="flex justify-center items-start py-10 px-6 flex-1">
    <div class="bg-white w-full max-w-xl p-8 rounded-2xl border-2 border-green-400 shadow-xl">
      <h1 class="text-2xl font-bold text-blue-700 mb-6 flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A13.937 13.937 0 0112 15c2.485 0 4.797.657 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        Profile Details
      </h1>
      <!-- User Info Card -->
      <div class="bg-blue-50 rounded-xl p-6 mb-8 border border-blue-200 shadow-sm">
        <div class="mb-3">
          <span class="font-semibold text-gray-700">Username:</span>
          <span class="text-blue-700 font-bold" th:text="${user.username}">username</span>
        </div>
        <div class="mb-3">
          <span class="font-semibold text-gray-700">Email:</span>
          <span class="text-blue-700 font-bold" th:text="${user.email}">email@example.com</span>
        </div>
        <div class="mb-3">
          <span class="font-semibold text-gray-700">Role:</span>
          <span class="text-green-700 font-bold" th:text="${user.role}">USER</span>
        </div>
        <div class="mb-3">
          <span class="font-semibold text-gray-700">Password:</span>
          <span class="text-gray-500 font-mono">********</span>
        </div>
      </div>
      <!-- Change Password Form -->
      <div class="bg-white rounded-xl border-2 border-blue-400 p-6 shadow-sm">
        <h2 class="text-lg font-bold text-blue-700 mb-4">Change Password</h2>
        <form th:action="@{/user/profile/change-password}" method="post" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Current Password</label>
            <input type="password" name="currentPassword" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">New Password</label>
            <input type="password" name="newPassword" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-400 focus:outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Confirm New Password</label>
            <input type="password" name="confirmPassword" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-400 focus:outline-none">
          </div>
          <button type="submit" class="w-full bg-green-600 text-white font-semibold py-2 rounded-lg hover:bg-green-700 transition-all duration-200 shadow-md">Change Password</button>
        </form>
        <div th:if="${error}" class="text-red-600 text-center text-sm mt-3" th:text="${error}"></div>
        <div th:if="${success}" class="text-green-600 text-center text-sm mt-3" th:text="${success}"></div>
      </div>
    </div>
  </main>
  <!-- FOOTER -->
  <div th:replace="user/dashboard :: footer"></div>
</body>
</html>
