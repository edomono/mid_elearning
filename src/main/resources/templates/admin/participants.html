<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Participants</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-50 min-h-screen flex flex-col">
  <div th:replace="user/dashboard :: header"></div>

  <main class="flex-1 px-8 py-10">
    <div class="max-w-5xl mx-auto bg-white border-2 border-blue-400 rounded-2xl shadow-lg p-8">
      <h2 class="text-xl font-bold text-blue-700 mb-6">Participants List
        <button id="open-add-participant-modal-btn" class="ml-4 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm">
          + Add Participant
        </button>
      </h2>

      <div th:replace="~{fragments/admin-add-participant-modal :: #admin-add-participant-modal}"></div>
      <div th:insert="~{fragments/admin-participant-details-modal :: participant-details-modal}"></div>
      <div th:insert="~{fragments/attendance-modal :: attendanceModal}"></div>

      <table class="min-w-full border border-gray-300 rounded-lg mb-8">
        <thead class="bg-blue-100 text-blue-700">
          <tr>
            <th class="py-2 px-4 text-left">Name</th>
            <th class="py-2 px-4 text-left">Email</th>
            <th class="py-2 px-4 text-left">Actions</th> <!-- New header for actions -->
          </tr>
        </thead>
        <tbody>
          <tr th:each="student : ${students}" class="border-t hover:bg-gray-50">
            <td class="py-2 px-4">
              <a href="#" class="text-blue-600 hover:underline font-medium attendance-open-link" th:data-participant-id="${student.id}" th:text="${student.username}"></a>
              <button th:if="${#strings.matches(student.role, '(?i).*USER.*')}" type="button" title="View Attendance" class="ml-3 px-2 py-1 bg-blue-500 text-white rounded text-sm inline-view-attendance-btn" th:data-participant-id="${student.id}">Lihat</button>
            </td>
            <td class="py-2 px-4" th:text="${student.email}"></td>
            <td class="py-2 px-4">
              <a href="#" class="text-sm text-gray-600 view-participant-btn" th:data-participant-id="${student.id}">Details</a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <footer class="bg-white border-t-4 border-green-400 mt-auto py-6 text-center text-gray-500">
    © 2025 MID E-Learning
  </footer>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      console.log('DOM fully loaded and parsed');

      const addParticipantModal = document.getElementById('admin-add-participant-modal');
      const openAddParticipantBtn = document.getElementById('open-add-participant-modal-btn');
      const closeAddParticipantBtn = document.getElementById('admin-close-add-participant-modal-btn');
      const cancelAddParticipantBtn = document.getElementById('admin-cancel-add-participant-btn');

      if (openAddParticipantBtn) {
        openAddParticipantBtn.addEventListener('click', () => {
          addParticipantModal.classList.remove('hidden');
        });
      }

      if (closeAddParticipantBtn) {
        closeAddParticipantBtn.addEventListener('click', () => {
          addParticipantModal.classList.add('hidden');
        });
      }

      if (cancelAddParticipantBtn) {
        cancelAddParticipantBtn.addEventListener('click', () => {
          addParticipantModal.classList.add('hidden');
        });
      }

      // Close add participant modal when clicking outside
      window.addEventListener('click', (event) => {
        if (event.target === addParticipantModal) {
          addParticipantModal.classList.add('hidden');
        }
      });

  // Participant Details Modal Logic
      const participantDetailsModal = document.getElementById('participant-details-modal');
      const closeParticipantDetailsModalBtn = document.getElementById('close-participant-modal-btn');
      const editForm = document.getElementById('editParticipantForm');
      const viewAttendanceBtn = document.getElementById('view-attendance-btn');
      let currentParticipantId = null;

      // Inline view buttons are rendered server-side; no debug forcing here.

      document.body.addEventListener('click', function(event) {
        if (event.target.classList.contains('view-participant-btn')) {
          event.preventDefault();
          const participantId = event.target.dataset.participantId;
          console.log('view-participant-btn clicked, participantId:', participantId);
          currentParticipantId = participantId;
          // Ensure the View Attendance button has the participant id immediately
          if (viewAttendanceBtn && participantId) {
            viewAttendanceBtn.dataset.participantId = participantId;
            viewAttendanceBtn.style.display = 'inline-block';
          }
          fetchParticipantDetails(participantId);
        }
      });

      if(closeParticipantDetailsModalBtn){
        closeParticipantDetailsModalBtn.addEventListener('click', () => {
          participantDetailsModal.classList.add('hidden');
        });
      }

      window.addEventListener('click', (event) => {
        if (event.target === participantDetailsModal) {
          participantDetailsModal.classList.add('hidden');
        }
      });

      if(viewAttendanceBtn) {
        viewAttendanceBtn.addEventListener('click', function(e) {
          e.preventDefault();
          const pid = this.dataset.participantId || currentParticipantId;
          console.log('viewAttendanceBtn clicked, participantId:', pid);
          if (participantDetailsModal) participantDetailsModal.classList.add('hidden');
          fetchAndShowAttendanceModal(pid, true);
        });
      }

      function fetchParticipantDetails(id) {
        fetch(`/api/admin/participants/${id}`) // Assuming an API endpoint for fetching participant details
          .then(response => {
            if (!response.ok) {
              throw new Error('Network response was not ok');
            }
            return response.json();
          })
          .then(participant => {
            const modalUsername = document.getElementById('modal-username');
            const modalEmail = document.getElementById('modal-email');
            const modalRole = document.getElementById('modal-role');

            if (modalUsername) modalUsername.value = participant.username;
            if (modalEmail) modalEmail.value = participant.email;
            if (modalRole) modalRole.value = participant.role;

            // Update form actions with participant ID
            if (editForm) editForm.action = `/admin/participant/${participant.id}/update`;

            const delForm = document.getElementById('deleteParticipantForm');
            if (delForm) delForm.action = `/admin/participant/${participant.id}/delete`;

            if (viewAttendanceBtn) {
              // Show View Attendance only for users with role "USER"
              if (participant.role && participant.role.toUpperCase() === 'USER') {
                // set a useful fallback href (so middle-click / copy-link works)
                viewAttendanceBtn.href = `/admin/attendance/${participant.id}`;
                viewAttendanceBtn.style.display = 'inline-block';
              } else {
                // hide button for non-user roles
                viewAttendanceBtn.style.display = 'none';
                viewAttendanceBtn.removeAttribute('href');
              }
            }

            if (participantDetailsModal) {
              participantDetailsModal.classList.remove('hidden');
            } else {
              console.error('Error: participantDetailsModal element not found.');
            }
          })
          .catch(error => {
            console.error('Error fetching participant details:', error);
            alert('Failed to load participant details.');
          });
      }

        // Attendance modal logic (mirrored from mentor) — admin mode
        const attendanceModal = document.getElementById('attendance-modal');
        const closeAttendanceModalBtn = document.getElementById('close-attendance-modal-btn');
        const attendanceCalendar = document.getElementById('attendance-calendar');
        const attendanceOwner = document.getElementById('attendance-owner');
        const attendanceMonthInfo = document.getElementById('attendance-month-info');
        const attendancePrev = document.getElementById('attendance-prev');
        const attendanceNext = document.getElementById('attendance-next');
        const attendanceExportBtn = document.getElementById('attendance-export-btn');

        let currentAttendanceOwnerId = null;
        let currentYear = null;
        let currentMonth = null;

        function renderCalendar(presentDays, year, month) {
          attendanceCalendar.innerHTML = '';
          const ym = new Date(year, month - 1, 1);
          const firstDay = new Date(ym.getFullYear(), ym.getMonth(), 1).getDay();
          const daysInMonth = new Date(ym.getFullYear(), ym.getMonth() + 1, 0).getDate();
          const offset = (firstDay + 6) % 7;
          for (let i = 0; i < offset; i++) {
            const cell = document.createElement('div');
            cell.className = 'p-3';
            attendanceCalendar.appendChild(cell);
          }
          for (let d = 1; d <= daysInMonth; d++) {
            const date = new Date(year, month -1, d);
            const iso = date.toISOString().slice(0,10);
            const cell = document.createElement('div');
            const isWeekend = date.getDay() === 0 || date.getDay() === 6;
            cell.className = 'p-3 border rounded';
            if (isWeekend) {
              cell.classList.add('bg-gray-100', 'text-gray-400');
            } else if (presentDays.includes(iso)) {
              cell.classList.add('bg-green-200', 'text-green-800');
            } else {
              cell.classList.add('bg-red-200', 'text-red-800');
            }
            cell.innerText = d;
            attendanceCalendar.appendChild(cell);
          }
        }

        function fetchAndShowAttendanceModal(id, isAdmin, year, month) {
          currentAttendanceOwnerId = id;
          let url = `/api/attendance/${id}`;
          if (year && month) {
            url += `?year=${year}&month=${month}`;
          }
          fetch(url)
            .then(r => r.ok ? r.json() : Promise.reject('Failed to fetch'))
            .then(payload => {
              attendanceOwner.innerText = payload.ownerUsername || ('User ' + payload.ownerId);
              currentYear = payload.year;
              currentMonth = payload.month;
              attendanceMonthInfo.innerText = `${currentMonth}/${currentYear}`;
              renderCalendar(payload.presentDays || [], currentYear, currentMonth);
              attendanceExportBtn.href = isAdmin ? `/admin/attendance/${id}/export?year=${currentYear}&month=${currentMonth}` : `/mentor/attendance/${id}/export?year=${currentYear}&month=${currentMonth}`;
              attendanceModal.classList.remove('hidden');
            })
            .catch(err => {
              console.error('Error loading attendance:', err);
              alert('Gagal memuat data absensi.');
            });
        }

        if (closeAttendanceModalBtn) {
          closeAttendanceModalBtn.addEventListener('click', () => attendanceModal.classList.add('hidden'));
        }

        if (attendancePrev) {
          attendancePrev.addEventListener('click', () => {
            if (!currentYear || !currentMonth || !currentAttendanceOwnerId) return;
            let y = currentYear;
            let m = currentMonth - 1;
            if (m < 1) { m = 12; y--; }
            fetchAndShowAttendanceModal(currentAttendanceOwnerId, true, y, m);
          });
        }

        if (attendanceNext) {
          attendanceNext.addEventListener('click', () => {
            if (!currentYear || !currentMonth || !currentAttendanceOwnerId) return;
            let y = currentYear;
            let m = currentMonth + 1;
            if (m > 12) { m = 1; y++; }
            fetchAndShowAttendanceModal(currentAttendanceOwnerId, true, y, m);
          });
        }

        // Intercept clicks on username links and inline admin buttons to open modal
        document.body.addEventListener('click', function(e) {
          const el = e.target;
          if (el.classList && el.classList.contains('attendance-open-link')) {
            e.preventDefault();
            const id = el.dataset.participantId;
            fetchAndShowAttendanceModal(id, true);
          }
          if (el.classList && el.classList.contains('inline-view-attendance-btn')) {
            e.preventDefault();
            const id = el.dataset.participantId;
            fetchAndShowAttendanceModal(id, true);
          }
        });
    });
  </script>
</body>
</html>
