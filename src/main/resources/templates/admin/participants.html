<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title>Participants</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-50 min-h-screen flex flex-col">
  <header class="bg-white border-b-4 border-green-400 flex justify-between items-center px-6 py-3 rounded-b-lg shadow-md">
    <div class="flex items-center space-x-3">
      <img src="/images/logo.png" alt="Logo" class="h-10">
      <div>
        <h1 class="text-lg font-bold text-green-700">Intelsysdata</h1>
        <p class="text-xs text-gray-500 -mt-1">Business Intelligence Solution</p>
      </div>
    </div>
    <nav class="space-x-6">
      <a href="/admin/dashboard" class="text-gray-600 hover:text-blue-600 font-medium">Subjects</a>
      <a href="/admin/participants" class="text-blue-600 font-bold border-b-2 border-blue-600 pb-1">Participants</a>
    </nav>
  </header>

  <main class="flex-1 px-8 py-10">
    <div class="max-w-5xl mx-auto bg-white border-2 border-blue-400 rounded-2xl shadow-lg p-8">
      <h2 class="text-xl font-bold text-blue-700 mb-6">Participants List</h2>

      <table class="min-w-full border border-gray-300 rounded-lg mb-8">
        <thead class="bg-blue-100 text-blue-700">
          <tr>
            <th class="py-2 px-4 text-left">Name</th>
            <th class="py-2 px-4 text-left">Email</th>
            <th class="py-2 px-4 text-left">Role</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="p : ${participants}" class="border-t hover:bg-gray-50">
            <td class="py-2 px-4" th:text="${p.name}"></td>
            <td class="py-2 px-4" th:text="${p.email}"></td>
            <td class="py-2 px-4" th:text="${p.role}"></td>
          </tr>
        </tbody>
      </table>

      <h3 class="text-lg font-semibold text-green-600 mb-4">Add New Participant</h3>
      <form th:action="@{/admin/participants/add}" method="post" class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        
        <input type="text" name="name" placeholder="Full Name" required
               class="border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-green-400">

        <input type="email" name="email" placeholder="Email" required
               class="border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-green-400">

        <input type="text" name="role" placeholder="Role (optional)"
               class="border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-green-400">

        <div class="md:col-span-3 flex justify-end">
          <button type="submit" 
                  class="bg-green-500 hover:bg-green-600 text-white px-5 py-2 rounded-lg font-semibold">
            Add Participant
          </button>
        </div>
      </form>
    </div>
  </main>

  <footer class="bg-white border-t-4 border-green-400 mt-auto py-6 text-center text-gray-500">
    © 2025 MID E-Learning
  </footer>
</body>
</html>
