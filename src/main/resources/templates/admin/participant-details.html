<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Participant Details</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-blue-600 min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="bg-white shadow-md py-4 px-8"></header>

  <!-- Main Content -->
  <main class="flex flex-col items-center justify-center flex-1 px-6">
    <div class="bg-white border-4 border-green-400 rounded-2xl shadow-lg p-8 w-full max-w-2xl">
      <h1 class="text-center text-2xl font-bold text-blue-600 mb-6">Participant Details</h1>

      <!-- Form Edit -->
      <form id="editForm" th:action="@{'/admin/participant/' + ${participant.id} + '/update'}"
            th:object="${participant}" method="post" class="space-y-6">

        <!-- Username -->
        <div>
          <label class="block font-semibold text-gray-700 mb-2">Username</label>
          <input type="text" th:field="*{username}"
                 class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-400"/>
        </div>

        <!-- Email -->
        <div>
          <label class="block font-semibold text-gray-700 mb-2">Email</label>
          <input type="email" th:field="*{email}"
                 class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-400"/>
        </div>

        <!-- Role -->
        <div>
          <label class="block font-semibold text-gray-700 mb-2">Role</label>
          <select th:field="*{role}" 
                  class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-400">
            <option value="USER">User</option>
            <option value="MENTOR">Mentor</option>
            <option value="ADMIN">Admin</option>
          </select>
        </div>

      </form>

      <!-- Buttons -->
      <div class="flex justify-between mt-8">
        <a href="/admin/dashboard"
           class="px-5 py-2 rounded-lg bg-gray-300 hover:bg-gray-400 text-gray-700 font-semibold transition">
           ← Back
        </a>

        <div class="flex gap-3">
          <!-- Save Changes -->
          <button type="submit" form="editForm"
                  class="px-5 py-2 rounded-lg bg-green-500 hover:bg-green-600 text-white font-semibold transition">
            Save Changes
          </button>

          <!-- Delete -->
          <form th:action="@{'/admin/participant/' + ${participant.id} + '/delete'}" method="post"
                onsubmit="return confirm('Are you sure you want to remove this participant?');">
            <button type="submit"
                    class="px-5 py-2 rounded-lg bg-red-500 hover:bg-red-600 text-white font-semibold transition">
              Remove
            </button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-white shadow-inner py-6 px-8 mt-8"></footer>
</body>
</html>
