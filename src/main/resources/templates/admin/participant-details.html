<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Participant Details</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-blue-600 min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="bg-white shadow-md py-4 px-8">
    <div th:insert="~{fragments/back-button :: backButton(defaultUrl='/admin/dashboard')}"></div>
  </header>

  <!-- Main Content -->
  <main class="flex flex-col items-center justify-center flex-1 px-6">
    <div class="bg-white border-4 border-green-400 rounded-2xl shadow-lg p-8 w-full max-w-2xl">
      <h1 class="text-center text-2xl font-bold text-blue-600 mb-6">Participant Details</h1>
      <p>Username: <span th:text="${participant.username}"></span></p>
      <p>Email: <span th:text="${participant.email}"></span></p>
      <p>Role: <span th:text="${participant.role}"></span></p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-white shadow-inner py-6 px-8 mt-8"></footer>
</body>
</html>
