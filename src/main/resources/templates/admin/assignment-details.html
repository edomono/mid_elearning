<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-4xl mx-auto bg-white p-8 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-4">Assignment Details</h1>
        <div th:if="${assignment.isPresent()}">
            <h2 class="text-xl font-semibold" th:text="${assignment.get().title}">Assignment Title</h2>
            <p class="text-gray-700" th:text="${assignment.get().description}">Assignment Description</p>
            <p class="text-gray-600">Due Date: <span th:text="${#temporals.format(assignment.get().dueDate, 'dd-MM-yyyy HH:mm')}"></span></p>
            <p th:if="${assignment.get().fileName}" class="text-gray-600">File: <a th:href="@{'/uploads/assignments/' + ${assignment.get().fileName}}" th:text="${assignment.get().fileName}"></a></p>
            
            <h3 class="text-lg font-semibold mt-6">Submissions</h3>
            <div th:if="${not #lists.isEmpty(submissions)}">
                <ul>
                    <li th:each="submission : ${submissions}" class="border-b py-2">
                        <p>Student: <span th:text="${submission.user.username}"></span></p>
                        <p>Submitted: <span th:text="${#temporals.format(submission.uploadTime, 'dd-MM-yyyy HH:mm')}"></span></p>
                        <p th:if="${submission.grade}">Grade: <span th:text="${submission.grade}"></span></p>
                        <p th:if="${submission.comment}">Comment: <span th:text="${submission.comment}"></span></p>
                        <p>File: <a th:href="@{'/uploads/submissions/' + ${submission.id} + '/' + ${submission.fileName}}" th:text="${submission.fileName}"></a></p>
                        <form th:action="@{'/admin/submission/' + ${submission.id} + '/grade'}" method="post" class="mt-2">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <div class="flex items-center">
                                <input type="text" name="grade" placeholder="Grade" class="border p-1 rounded w-24">
                                <input type="text" name="comment" placeholder="Comment" class="border p-1 rounded ml-2 flex-grow">
                                <button type="submit" class="bg-green-500 text-white px-3 py-1 rounded ml-2 hover:bg-green-600">Grade</button>
                            </div>
                        </form>
                        <form th:action="@{'/admin/submission/' + ${submission.id} + '/delete'}" method="post" class="mt-2">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <button type="submit" class="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600" onclick="return confirm('Are you sure you want to delete this submission?');">Delete</button>
                        </form>
                    </li>
                </ul>
            </div>
            <div th:unless="${not #lists.isEmpty(submissions)}">
                <p>No submissions yet.</p>
            </div>

            <a th:href="@{'/admin/assignment/' + ${assignment.get().id} + '/edit'}" class="mt-4 inline-block bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Edit Assignment</a>
        </div>
        <div th:unless="${assignment.isPresent()}">
            <p>Assignment not found.</p>
        </div>
    </div>
</body>
</html>
