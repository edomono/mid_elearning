<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Progress</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="container">
    <h1 th:text="${subject.name} + ' - Student Progress'"></h1>
    <div class="row">
        <div class="col-md-12">
            <table class="table">
                <thead>
                <tr>
                    <th>Student</th>
                    <th>Submission %</th>
                    <th>Average Grade</th>
                    <th>Problems</th>
                    <th>Grade History</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="progress : ${studentProgress}">
                    <td th:text="${progress.studentName}"></td>
                    <td th:text="${#numbers.formatDecimal(progress.submissionPercentage, 1, 2)} + '%'"></td>
                    <td th:text="${#numbers.formatDecimal(progress.averageGrade, 1, 2)}"></td>
                    <td>
                        <span th:if="${progress.hasSubmissionProblem}" class="badge badge-danger">Low Submission</span>
                        <span th:if="${progress.hasGradeProblem}" class="badge badge-warning">Low Grade</span>
                    </td>
                    <td>
                        <canvas th:id="'chart-' + ${progress.studentId}" width="400" height="100"></canvas>
                        <script th:inline="javascript">
                            /*<![CDATA[*/
                            var gradeHistory = /*[[${progress.gradeHistory}]]*/ [];
                            if (gradeHistory && gradeHistory.length > 0) {
                                var labels = gradeHistory.map(function (gh) {
                                    return gh.assignmentTitle;
                                });
                                var data = gradeHistory.map(function (gh) {
                                    return gh.grade;
                                });
                                var ctx = document.getElementById('chart-' + /*[[${progress.studentId}]]*/).getContext('2d');
                                new Chart(ctx, {
                                    type: 'line',
                                    data: {
                                        labels: labels,
                                        datasets: [{
                                            label: 'Grade',
                                            data: data,
                                            borderColor: 'rgba(75, 192, 192, 1)',
                                            borderWidth: 1,
                                            fill: false
                                        }]
                                    },
                                    options: {
                                        scales: {
                                            y: {
                                                beginAtZero: true,
                                                max: 100
                                            }
                                        }
                                    }
                                });
                            }
                            /*]]>*/
                        </script>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
