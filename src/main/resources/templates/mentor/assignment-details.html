<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="'Assignment: ' + ${assignment.title}">Assignment Detail</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#0074cc] min-h-screen flex flex-col">
  <!-- HEADER -->
  <header class="bg-white border-b-4 border-green-400 flex justify-between items-center px-6 py-3 rounded-b-lg shadow-md">
    <div class="flex items-center space-x-3">
      <img src="/images/logo.png" alt="Logo" class="h-10">
      <div>
        <h1 class="text-lg font-bold text-green-700">Intelsysdata</h1>
        <p class="text-xs text-gray-500 -mt-1">Business Intelligence Solution</p>
      </div>
    </div>
    <div class="text-right">
      <p class="text-sm font-semibold text-blue-700">Mentor</p>
      <a href="/logout" class="text-xs text-gray-500 hover:underline">Logout</a>
    </div>
  </header>

  <!-- MAIN -->
  <main class="flex-1 flex justify-center items-start py-10 px-6">
    <div class="bg-white w-3/4 p-6 rounded-2xl border-2 border-green-400 shadow-md relative">

      <!-- Title and Delete Button -->
      <div class="flex justify-between items-start mb-4">
        <div>
          <h2 class="text-blue-700 font-bold text-xl mb-1" th:text="${assignment.title}">Assignment Title</h2>
          <p class="text-gray-700" th:text="${assignment.description}">Assignment Description</p>
        </div>
        <form th:action="@{'/mentor/assignment/' + ${assignment.id} + '/delete'}"
              method="post"
              onsubmit="return confirm('Are you sure you want to delete this assignment?');">
          <button type="submit"
                  class="bg-red-600 text-white px-4 py-2 rounded-lg shadow hover:bg-red-700 transition">
            🗑 Delete
          </button>
        </form>
      </div>

      <!-- File Section -->
      <div class="mb-6">
        <a th:if="${assignment.filePath != null}"
           th:href="@{'/' + ${assignment.filePath}}"
           target="_blank"
           class="bg-green-600 text-white px-3 py-1 rounded hover:bg-green-700">
          📄 View Assignment File
        </a>
        <p th:if="${assignment.filePath == null}" class="text-gray-500 italic">No file uploaded.</p>
      </div>

      <hr class="my-6 border-gray-300">

      <!-- Submissions -->
      <h3 class="text-lg font-bold text-blue-700 mb-4">Uploaded Submissions</h3>

      <div th:if="${#lists.isEmpty(submissions)}" class="text-gray-500 italic">
        No student submissions yet.
      </div>

      <div class="space-y-4" th:each="submission : ${submissions}">
        <div class="border border-gray-300 rounded-lg p-4 bg-gray-50 hover:bg-gray-100 transition relative group">

          <div class="flex justify-between items-center">
            <div>
              <p class="font-semibold text-gray-800" th:text="${submission.user.username}">Student Name</p>
              <p class="text-sm text-gray-500"
                 th:text="${#dates.format(submission.uploadTime, 'dd MMM yyyy HH:mm')}">28 Oct 2025</p>
              <a th:href="@{'/' + ${submission.filePath}}"
                 target="_blank"
                 class="text-blue-600 text-sm hover:underline">📂 View File</a>
            </div>

            <div class="text-right">
              <p class="text-sm text-gray-700">
                Grade:
                <span th:text="${submission.grade != null ? submission.grade : 'N/A'}">N/A</span>
              </p>
              <p class="text-xs text-gray-500">
                Comment:
                <span th:text="${submission.comment != null ? submission.comment : '-'}">-</span>
              </p>
            </div>
          </div>

          <!-- INLINE GRADE FORM -->
          <div class="absolute bottom-2 right-2 opacity-0 group-hover:opacity-100 transition">
            <form th:action="@{'/mentor/submission/' + ${submission.id} + '/grade'}"
                  method="post" class="flex space-x-2">
              <input type="text" name="grade" placeholder="Grade"
                     class="border rounded px-2 py-1 text-sm w-20 focus:ring-2 focus:ring-green-400">
              <input type="text" name="comment" placeholder="Comment"
                     class="border rounded px-2 py-1 text-sm w-40 focus:ring-2 focus:ring-green-400">
              <button type="submit"
                      class="bg-green-600 text-white px-3 py-1 rounded hover:bg-green-700 text-sm">
                Grade
              </button>
            </form>
          </div>
        </div>
      </div>

      <div class="mt-6">
        <a th:href="@{'/mentor/course/' + ${assignment.subject.id}}"
           class="text-blue-700 hover:underline">← Back to Course</a>
      </div>
    </div>
  </main>
</body>
</html>
