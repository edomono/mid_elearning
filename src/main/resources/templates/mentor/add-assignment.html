<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mentor | Add Assignment</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-blue-50 flex justify-center py-12 px-4">

  <div class="bg-white w-full max-w-2xl p-6 rounded-xl shadow-md border border-green-400 mx-auto">
    <h2 class="text-xl font-bold text-blue-700 mb-4">Add New Assignment</h2>

    <!-- 🔄 Perubahan dari /admin/... menjadi /mentor/... -->
    <form th:action="@{'/mentor/course/' + ${subjectId} + '/assignments/add'}"
          method="post" enctype="multipart/form-data" class="space-y-4">

      <div>
        <label class="block font-semibold text-gray-600 mb-1">Title</label>
        <input type="text" name="title" class="border border-gray-300 rounded w-full p-2" required>
      </div>

      <div>
        <label class="block font-semibold text-gray-600 mb-1">Description</label>
        <textarea name="description" class="border border-gray-300 rounded w-full p-2 h-28"></textarea>
      </div>

      <div>
        <label class="block font-semibold text-gray-600 mb-1">Upload File (PDF/PPT)</label>
        <input type="file" name="file" accept=".pdf,.ppt,.pptx" class="border border-gray-300 rounded w-full p-2">
      </div>

      <div>
        <label for="dueDate" class="block font-semibold text-gray-600 mb-1">Due Date</label>
        <input type="datetime-local" id="dueDate" name="dueDate" class="border border-gray-300 rounded w-full p-2" required>
      </div>

      <button type="submit"
              class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700">
        Save Assignment
      </button>
    </form>

    <div class="mt-6">
      <a th:href="@{'/mentor/course/' + ${subjectId}}"
         class="text-blue-700 hover:underline text-sm">← Back to Course Details</a>
    </div>
  </div>

</body>
</html>
