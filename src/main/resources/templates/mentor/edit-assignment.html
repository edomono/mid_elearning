<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Assignment</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-50 flex justify-center py-12 px-4">

  <div class="bg-white w-full max-w-2xl p-6 rounded-xl shadow-md border border-green-400 mx-auto">
    <h2 class="text-xl font-bold text-blue-700 mb-4">Edit Assignment</h2>

    <form th:action="@{'/mentor/assignment/' + ${assignment.id} + '/edit'}" th:object="${assignment}" method="post" enctype="multipart/form-data" class="space-y-4">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
      <div>
        <label class="block font-semibold text-gray-600 mb-1">Title</label>
        <input type="text" name="title" th:field="*{title}" class="border border-gray-300 rounded w-full p-2" required>
      </div>

      <div>
        <label class="block font-semibold text-gray-600 mb-1">Description</label>
        <textarea name="description" th:field="*{description}" class="border border-gray-300 rounded w-full p-2 h-28"></textarea>
      </div>

      <div>
        <label class="block font-semibold text-gray-600 mb-1">Upload File (PDF/PPT)</label>
        <input type="file" name="file" accept=".pdf,.ppt,.pptx" class="border border-gray-300 rounded w-full p-2">
        <p th:if="*{fileName != null}" class="text-sm text-gray-500 mt-1">Current file: <span th:text="*{fileName}"></span></p>
      </div>

      <div>
        <label for="dueDate" class="block font-semibold text-gray-600 mb-1">Due Date</label>
        <input type="datetime-local" id="dueDate" name="dueDate" th:value="${#temporals.format(assignment.dueDate, 'yyyy-MM-dd HH:mm')}" class="border border-gray-300 rounded w-full p-2" required>
      </div>

      <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700">
        Update Assignment
      </button>
    </form>
  </div>

</body>
</html>
