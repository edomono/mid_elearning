<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="relative min-h-screen"
      style="background-image: url('/images/login-bg.png'); background-size: 100%; background-repeat: no-repeat; background-position: center;">

  <!-- Overlay gelap -->
  <div class="absolute inset-0 bg-black/5"></div> 

  <!-- Kontainer form -->
  <div class="relative flex items-center justify-center min-h-screen px-4">
    <div class="w-full max-w-md bg-white/90 backdrop-blur-xl rounded-2xl shadow-lg p-8 border-4" style=" border-color: #46AD38 ;">

      <!-- Gambar header -->
      <div class="flex justify-center mb-6">
        <img src="/images/header-logo.png" alt="Logo" class="h-16 object-contain">
      </div>

      <!-- Judul -->
      <h1 class="text-2xl font-semibold text-center text-gray-800 mb-6">Login</h1>

      <!-- Notifikasi -->
      <p th:if="${success}" 
         class="text-green-600 text-center text-sm mb-3 font-medium"
         th:text="${success}"></p>

      <p th:if="${error}" 
         class="text-red-600 text-center text-sm mb-3 font-medium"
         th:text="${error}"></p>

      <!-- Form -->
      <form th:action="@{/login}" method="post" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">Username</label>
          <input type="text" name="username" required
                 class="w-full mt-1 p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700">Password</label>
          <input type="password" name="password" required
                 class="w-full mt-1 p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" />
        </div>

        <button type="submit"
          class="w-full py-2 mt-2 bg-[#0578C8] text-white rounded-lg font-semibold hover:bg-[#1558B0] transition">
          Login
        </button>

      </form>

      <!-- Link ke register -->
      <p class="text-center text-sm text-gray-600 mt-4">
        Belum punya akun?
        <a href="/register" class="text-blue-600 hover:underline font-semibold">Daftar di sini</a>
      </p>
    </div>
  </div>
</body>
</html>
