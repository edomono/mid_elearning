<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="relative min-h-screen"
      style="background-image: url('/images/login-bg.png'); background-size: cover; background-repeat: no-repeat; background-position: center;">

  <!-- Overlay gelap -->
  <div class="absolute inset-0 bg-black/40"></div> 

  <!-- Kontainer utama -->
  <div class="relative flex items-center justify-center min-h-screen px-4">
    <div class="w-full max-w-md bg-white/95 backdrop-blur-lg rounded-2xl shadow-2xl p-8 border-4 border-[#46AD38]">

      <!-- Header Logo -->
      <div class="flex justify-center mb-6">
        <img src="/images/header-logo.png" alt="Logo" class="h-16 object-contain">
      </div>

      <!-- Judul -->
      <h1 class="text-2xl font-semibold text-center text-gray-800 mb-6">Login</h1>

      <!-- Notifikasi -->
      <div th:if="${success}" class="mb-4 p-3 text-sm text-green-700 bg-green-100 border border-green-300 rounded-lg text-center" th:text="${success}"></div>
      <div th:if="${error}" class="mb-4 p-3 text-sm text-red-700 bg-red-100 border border-red-300 rounded-lg text-center" th:text="${error}"></div>
      <div th:if="${message}" class="mb-4 p-3 text-sm text-blue-700 bg-blue-100 border border-blue-300 rounded-lg text-center" th:text="${message}"></div>

      <!-- Form Login -->
      <form th:action="@{/process-login}" method="post" class="space-y-4">
        
        <!-- Username -->
        <div>
          <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
          <input id="username" name="username" type="text" required
                 class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#46AD38] focus:outline-none text-gray-800">
        </div>

        <!-- Password -->
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <input id="password" name="password" type="password" required
                 class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#46AD38] focus:outline-none text-gray-800">
        </div>

        <!-- Tombol Submit -->
        <button type="submit"
                class="w-full bg-[#46AD38] hover:bg-[#3c9730] text-white font-semibold py-2 rounded-lg transition duration-200">
          Login
        </button>
      </form>
    </div>
  </div>
</body>
</html>
