<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-100 flex items-center justify-center">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">
    <h1 class="text-2xl font-semibold text-center text-gray-700 mb-6">Login</h1>

    <!-- Notifikasi sukses & error -->
    <p th:if="${success}" 
       class="text-green-600 text-center text-sm mb-3 font-medium"
       th:text="${success}"></p>

    <p th:if="${error}" 
       class="text-red-600 text-center text-sm mb-3 font-medium"
       th:text="${error}"></p>

    <form th:action="@{/login}" method="post" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-600">Username</label>
        <input type="text" name="username" required
               class="w-full mt-1 p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-600">Password</label>
        <input type="password" name="password" required
               class="w-full mt-1 p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" />
      </div>

      <button type="submit"
              class="w-full py-2 mt-2 bg-blue-600 text-white rounded-lg font-semibold hover:bg-blue-700 transition">
        Login
      </button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-4">
      Belum punya akun?
      <a href="/register" class="text-blue-600 hover:underline">Daftar di sini</a>
    </p>
  </div>
</body>
</html>
