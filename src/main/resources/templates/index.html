<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50 flex flex-col items-center justify-center">
  <div class="bg-white rounded-2xl shadow-md w-full max-w-md p-8 text-center">
    <h1 class="text-2xl font-semibold text-gray-800 mb-4">Home</h1>

    <!-- Notifikasi -->
    <p th:if="${success}" 
       class="text-green-600 text-center text-sm mb-3 font-medium"
       th:text="${success}"></p>

    <p th:if="${error}" 
       class="text-red-600 text-center text-sm mb-3 font-medium"
       th:text="${error}"></p>

    <!-- Greeting user -->
    <p th:if="${user}" 
       class="text-gray-700 text-lg mb-6"
       th:text="'Selamat datang, ' + ${user.username} + '!'"></p>

    <form th:action="@{/logout}" method="post">
      <button type="submit"
              class="bg-red-500 text-white px-6 py-2 rounded-lg font-semibold hover:bg-red-600 transition">
        Logout
      </button>
    </form>
  </div>
</body>
</html>
