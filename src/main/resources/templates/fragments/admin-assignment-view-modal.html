<!-- Admin Assignment View Modal -->
<div id="admin-assignment-modal" class="fixed inset-0 bg-gray-800 bg-opacity-75 flex items-center justify-center z-50 hidden animate-fade-in">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-4xl max-h-[90vh] flex flex-col border-4 border-blue-400">
        <!-- Modal Header -->
        <div class="flex justify-between items-center p-4 border-b bg-blue-50 rounded-t-xl">
            <h2 id="admin-modal-title" class="text-2xl font-bold text-blue-700">Assignment Details</h2>
            <button id="admin-close-modal-btn" class="text-gray-500 hover:text-gray-800 text-3xl">&times;</button>
        </div>

        <!-- Modal Body -->
        <div class="p-6 overflow-y-auto">
            <!-- Assignment Info -->
            <div id="admin-modal-assignment-info" class="mb-6">
                <p id="admin-modal-description" class="text-gray-600 text-base mt-2"></p>
                <div class="mt-4 flex items-center gap-4">
                    <a id="admin-modal-file-link" href="#" target="_blank" class="hidden items-center gap-2 text-sm text-blue-600 hover:text-blue-800 bg-blue-100 px-3 py-1.5 rounded-lg">
                        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                        <span>View Assignment File</span>
                    </a>
                    <button type="button" id="admin-modal-edit-link" class="items-center gap-2 text-sm text-white bg-yellow-500 px-3 py-1.5 rounded-lg hover:bg-yellow-600">
                        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.5L14.732 3.732z" /></svg>
                        <span>Edit Assignment</span>
                    </button>
                    <button type="button" id="admin-modal-delete-link" class="items-center gap-2 text-sm text-white bg-red-500 px-3 py-1.5 rounded-lg hover:bg-red-600">
                        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                        <span>Delete Assignment</span>
                    </button>
                </div>
            </div>

            <!-- Submissions Section -->
            <div>
                <h3 class="text-xl font-bold text-blue-700 mb-4">Submissions</h3>
                <div id="admin-modal-submissions-list" class="space-y-4"></div>
                <div id="admin-no-submissions-msg" class="text-center py-8 text-gray-500 hidden">
                    <p class="text-lg font-medium">No Submissions Yet</p>
                </div>
            </div>
        </div>
    </div>
</div>
