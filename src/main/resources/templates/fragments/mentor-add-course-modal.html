<!-- Add Course Modal -->
<div id="mentor-add-course-modal" class="fixed inset-0 bg-gray-800 bg-opacity-75 flex items-center justify-center z-50 hidden animate-fade-in">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md max-h-[90vh] flex flex-col border-4 border-blue-400">
        <!-- Modal Header -->
        <div class="flex justify-between items-center p-4 border-b bg-blue-50 rounded-t-xl">
            <h2 class="text-2xl font-bold text-blue-700">Add New Course</h2>
            <button id="mentor-close-add-course-modal-btn" class="text-gray-500 hover:text-gray-800 text-3xl">&times;</button>
        </div>

        <!-- Modal Body -->
        <div class="p-6 overflow-y-auto">
            <!-- Error Message -->
            <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-2 rounded mb-4">
                <p th:text="${error}"></p>
            </div>

            <!-- FORM: Mentor Add Course -->
            <form id="add-course-form" th:action="@{'/mentor/course/add'}" method="post" class="space-y-6">
                <div th:if="${_csrf != null}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                </div>
                <!-- Course Name -->
                <div>
                    <label for="course-name" class="block font-semibold text-gray-700 mb-2">Course Name</label>
                    <input type="text" id="course-name" name="name" required
                           class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-400">
                </div>

                <!-- Course Description -->
                <div>
                    <label for="course-description" class="block font-semibold text-gray-700 mb-2">Description</label>
                    <textarea id="course-description" name="description" rows="4"
                              class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-400"></textarea>
                </div>

                <!-- Buttons -->
                <div class="flex justify-end mt-8">
                    <button type="button" id="mentor-cancel-add-course-btn"
                            class="px-5 py-2 rounded-lg bg-gray-300 hover:bg-gray-400 text-gray-700 font-semibold transition mr-4">
                        Cancel
                    </button>

                    <button type="submit"
                            class="px-5 py-2 rounded-lg bg-green-500 hover:bg-green-600 text-white font-semibold transition">
                        Save Course
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
