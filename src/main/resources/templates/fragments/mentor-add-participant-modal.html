<!-- Mentor Add Participant Modal -->
<div id="mentor-add-participant-modal" class="fixed inset-0 bg-gray-800 bg-opacity-75 flex items-center justify-center z-50 hidden animate-fade-in">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col border-4 border-green-400">
        <!-- Modal Header -->
        <div class="flex justify-between items-center p-4 border-b bg-green-50 rounded-t-xl">
            <h2 id="mentor-add-participant-modal-title" class="text-2xl font-bold text-green-700">Add New Participant</h2>
            <button id="mentor-close-add-participant-modal-btn" class="text-gray-500 hover:text-gray-800 text-3xl">&times;</button>
        </div>

        <!-- Modal Body -->
        <div class="p-6 overflow-y-auto">
            <!-- Form -->
            <form id="mentor-add-participant-form" th:action="@{/mentor/participant/add}" th:object="${participant}" method="post" class="space-y-6">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <!-- Username -->
                <div>
                    <label for="mentor-add-username" class="block font-semibold text-gray-700 mb-2">Username</label>
                    <input type="text" id="mentor-add-username" th:field="*{username}" placeholder="Enter username" required
                           class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-400">
                </div>

                <!-- Email -->
                <div>
                    <label for="mentor-add-email" class="block font-semibold text-gray-700 mb-2">Email</label>
                    <input type="email" id="mentor-add-email" th:field="*{email}" placeholder="Enter email address" required
                           class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-400">
                </div>

                <!-- Password -->
                <div>
                    <label for="mentor-add-password" class="block font-semibold text-gray-700 mb-2">Password</label>
                    <input type="password" id="mentor-add-password" th:field="*{password}" placeholder="Enter password"
                           class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-400">
                </div>

                <!-- Role -->
                <div>
                    <label for="mentor-add-role" class="block font-semibold text-gray-700 mb-2">Role</label>
                    <select id="mentor-add-role" th:field="*{role}" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-400">
                        <option value="USER">User</option>
                        <option value="MENTOR">Mentor</option>
                        <option value="ADMIN">Admin</option>
                    </select>
                </div>

                <!-- Buttons -->
                <div class="flex justify-end mt-8">
                    <button type="button" id="mentor-cancel-add-participant-btn"
                            class="px-5 py-2 rounded-lg bg-gray-300 hover:bg-gray-400 text-gray-700 font-semibold transition mr-4">
                        Cancel
                    </button>

                    <button type="submit"
                            class="px-5 py-2 rounded-lg bg-green-500 hover:bg-green-600 text-white font-semibold transition">
                        Save Participant
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const mentorAddModal = document.getElementById('mentor-add-participant-modal');
    const mentorCloseBtn = document.getElementById('mentor-close-add-participant-modal-btn');
    const mentorCancelBtn = document.getElementById('mentor-cancel-add-participant-btn');
    const mentorAddForm = document.getElementById('mentor-add-participant-form');

    if (mentorAddForm) {
        mentorAddForm.addEventListener('submit', function (e) {
            e.preventDefault();

            const formData = new FormData(mentorAddForm);
            const action = mentorAddForm.getAttribute('action');

            fetch(action, {
                method: 'POST',
                body: formData,
                headers: {
                    // CSRF token is already included in formData
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    Swal.fire({
                        icon: 'success',
                        title: 'Success!',
                        text: data.message,
                        timer: 2000,
                        showConfirmButton: false
                    }).then(() => {
                        window.location.reload();
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Oops...',
                        text: data.message || 'An unknown error occurred.',
                    });
                }
            })
            .catch(error => {
                console.error('Error:', error);
                Swal.fire({
                    icon: 'error',
                    title: 'Error!',
                    text: 'A network error occurred. Please try again.',
                });
            });
        });
    }

    function hideMentorModal() {
        if (mentorAddModal) {
            mentorAddModal.classList.add('hidden');
        }
    }

    if (mentorCloseBtn) {
        mentorCloseBtn.addEventListener('click', hideMentorModal);
    }
    if (mentorCancelBtn) {
        mentorCancelBtn.addEventListener('click', hideMentorModal);
    }
});
</script>
