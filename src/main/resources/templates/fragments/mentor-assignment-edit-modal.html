<!-- Mentor Assignment Edit Modal -->
<div id="mentor-edit-assignment-modal" class="fixed inset-0 bg-gray-800 bg-opacity-75 flex items-center justify-center z-50 hidden animate-fade-in">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-4xl max-h-[90vh] flex flex-col border-4 border-yellow-400">
        <!-- Modal Header -->
        <div class="flex justify-between items-center p-4 border-b bg-yellow-50 rounded-t-xl">
            <h2 id="mentor-edit-modal-title" class="text-2xl font-bold text-yellow-700">Edit Assignment</h2>
            <button id="mentor-close-edit-modal-btn" class="text-gray-500 hover:text-gray-800 text-3xl">&times;</button>
        </div>

        <!-- Modal Body -->
        <div class="p-6 overflow-y-auto">
            <form id="mentor-edit-assignment-form" action="#" method="post" enctype="multipart/form-data" class="bg-gray-50 p-4 rounded-lg border border-gray-300 space-y-3">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <input type="hidden" name="assignmentId" id="mentor-edit-assignment-id">
                <div>
                    <label for="mentor-edit-title" class="block text-sm font-semibold text-gray-600 mb-1">Title</label>
                    <input type="text" name="title" id="mentor-edit-title" class="border border-gray-300 rounded w-full p-2" required>
                </div>

                <div>
                    <label for="mentor-edit-description" class="block text-sm font-semibold text-gray-600 mb-1">Description</label>
                    <textarea name="description" id="mentor-edit-description" class="border border-gray-300 rounded w-full p-2 h-20"></textarea>
                </div>

                <div>
                    <label for="mentor-edit-file" class="block text-sm font-semibold text-gray-600 mb-1">Upload New File (PDF/PPT)</label>
                    <input type="file" name="file" id="mentor-edit-file" accept=".pdf,.ppt,.pptx" class="border border-gray-300 rounded w-full p-2 bg-white">
                    <p id="mentor-current-file-info" class="text-sm text-gray-500 mt-1"></p>
                </div>

                <div>
                    <label for="mentor-edit-dueDate" class="block text-sm font-semibold text-gray-600 mb-1">Due Date</label>
                    <input type="datetime-local" id="mentor-edit-dueDate" name="dueDate" class="border border-gray-300 rounded w-full p-2" required>
                </div>

                <div class="flex justify-between items-center mt-4">
                    <button type="button" id="mentor-back-to-view-btn" class="bg-gray-300 text-gray-800 px-4 py-2 rounded-lg hover:bg-gray-400 transition-colors duration-200">
                        Back
                    </button>
                    <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition-colors duration-200">
                        Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
