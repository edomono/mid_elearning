<div id="participant-details-modal" th:fragment="participant-details-modal" class="fixed inset-0 bg-gray-800 bg-opacity-75 flex items-center justify-center z-50 hidden animate-fade-in" xmlns:th="http://www.thymeleaf.org">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col border-4 border-blue-400">
        <!-- Modal Header -->
        <div class="flex justify-between items-center p-4 border-b bg-blue-50 rounded-t-xl">
            <h2 id="participant-modal-title" class="text-2xl font-bold text-blue-700">Participant Details</h2>
            <button id="close-participant-modal-btn" class="text-gray-500 hover:text-gray-800 text-3xl">&times;</button>
        </div>

        <!-- Modal Body -->
        <div class="p-6 overflow-y-auto">
            <!-- Participant Info -->
            <div id="modal-participant-info" class="mb-6">
                <form id="editParticipantForm" action="#" method="post" class="space-y-6">
                    <div th:if="${_csrf != null}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    </div>
                    <input type="hidden" name="_method" value="post" />

                    <!-- Username -->
                    <div>
                        <label class="block font-semibold text-gray-700 mb-2">Username</label>
                        <input type="text" id="modal-username" name="username"
                               class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-400"/>
                    </div>

                    <!-- Email -->
                    <div>
                        <label class="block font-semibold text-gray-700 mb-2">Email</label>
                        <input type="email" id="modal-email" name="email"
                               class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-400"/>
                    </div>

                    <!-- Role -->
                    <div>
                        <label class="block font-semibold text-gray-700 mb-2">Role</label>
                        <select id="modal-role" name="role"
                                class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-400">
                            <option value="USER">User</option>
                            <option value="MENTOR">Mentor</option>
                            <option value="ADMIN">Admin</option>
                        </select>
                    </div>
                </form>
            </div>

            <!-- Buttons -->
            <div class="flex justify-end mt-8 gap-3">
                <!-- Save Changes -->
                <button type="submit" form="editParticipantForm"
                        class="px-5 py-2 rounded-lg bg-green-500 hover:bg-green-600 text-white font-semibold transition">
                    Save Changes
                </button>

                <!-- Delete -->
                <form id="deleteParticipantForm" action="#" method="post"
                      onsubmit="return confirm('Are you sure you want to remove this participant?');">
                    <div th:if="${_csrf != null}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    </div>
                    <button type="submit"
                            class="px-5 py-2 rounded-lg bg-red-500 hover:bg-red-600 text-white font-semibold transition">
                        Remove
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
